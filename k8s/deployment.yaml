
apiVersion: apps/v1
kind: Deployment

metadata:
  name: retail-sales-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: retail-sales-api

  template:
    metadata:
      labels:
        app: retail-sales-api

    spec:
      containers:
        - name: retail-sales-container
          image: retail-sales-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
